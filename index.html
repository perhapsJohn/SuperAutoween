html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	/* phones: no text selection, long-press callout, tap flash or zoom (the arcade
	   can't inject this into a cross-origin frame, so the game page does it) */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}

#canvas { touch-action: none; }

#canvas {
	display: block;
}

#sound-chip {
	display: none;
	position: fixed;
	left: 12px;
	bottom: 12px;
	z-index: 20;
	padding: 10px 16px;
	border: 2px solid #f0a040;
	border-radius: 999px;
	background: rgba(30, 14, 40, 0.92);
	color: #ffe2b8;
	font: 600 16px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
	touch-action: manipulation;
}

#audio-beeps {
	position: fixed;
	left: 8px;
	top: 26px;
	z-index: 21;
	display: flex;
	gap: 6px;
}
#audio-beeps button {
	padding: 8px 10px;
	font: 600 14px/1 system-ui, -apple-system, sans-serif;
	border-radius: 8px;
	border: 1px solid #9f9;
	background: rgba(0, 0, 0, 0.8);
	color: #9f9;
}

#audio-debug {
	position: fixed;
	left: 0;
	right: 0;
	top: 0;
	z-index: 21;
	padding: 4px 8px;
	background: rgba(0, 0, 0, 0.75);
	color: #9f9;
	font: 12px/1.3 ui-monospace, Menlo, monospace;
	pointer-events: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b0f33;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

// Browsers start audio suspended until a gesture: keep every AudioContext the
// engine makes and resume them on the first tap / click / key.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	if (AC) {
		const Wrapped = function (...args) { const c = new AC(...args); ctxs.push(c); return c; };
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// iPhone: the ringer switch mutes Web Audio unless the page's audio session
	// is "playback" (Safari 17+); older iOS needs an <audio> element playing,
	// started from a tap, for the same effect.
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* not iOS */ }
	let silent = null;
	const keepSession = () => {
		if (silent || navigator.audioSession) { return; }
		silent = new Audio('data:audio/wav;base64,UklGRiUAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQEAAACA');
		silent.loop = true;
		silent.setAttribute('playsinline', '');
		silent.play().catch(() => { silent = null; });
	};
	// Every tap / click / key: resume any suspended (or iOS "interrupted", after a
	// call or app switch) context, and push one silent sample through it, which
	// older iOS needs before it really starts. Must run inside the gesture.
	const unlock = () => {
		keepSession();
		ctxs.forEach((c) => {
			if (c.state === 'running' || c.state === 'closed') { return; }
			c.resume();
			try {
				const b = c.createBufferSource();
				b.buffer = c.createBuffer(1, 1, 22050);
				b.connect(c.destination);
				b.start(0);
			} catch (e) { /* context not ready yet */ }
		});
	};
	['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'keydown', 'keyup', 'click'].forEach((e) => document.addEventListener(e, unlock, true));
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) { ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(() => {}); } }); }
	});
	window.__audio = ctxs;   // debugging: window.__audio.map((c) => c.state)

	// If sound is still blocked a moment after a tap (some iPads), offer a chip:
	// tapping it is a fresh gesture that retries everything. ?audiodebug=1 shows
	// the audio state on the device, for finding out why.
	const debug = new URLSearchParams(location.search).has('audiodebug');
	let chip = null;
	let line = null;
	const blocked = () => ctxs.some((c) => c.state !== 'running' && c.state !== 'closed');
	const refresh = () => {
		if (!document.body) { return; }
		if (!chip) {
			chip = document.createElement('button');
			chip.id = 'sound-chip';
			chip.textContent = 'Tap for sound';
			chip.addEventListener('click', (e) => { e.stopPropagation(); unlock(); setTimeout(refresh, 300); });
			document.body.appendChild(chip);
		}
		chip.style.display = blocked() ? 'block' : 'none';
		if (debug) {
			if (!line) {
				line = document.createElement('div');
				line.id = 'audio-debug';
				document.body.appendChild(line);
				// test beeps that skip the game: A through the game's own context,
				// B through a brand new context, C as a plain <audio> element
				const bar = document.createElement('div');
				bar.id = 'audio-beeps';
				const beep = (c) => {
					const o = c.createOscillator();
					const g = c.createGain();
					o.frequency.value = 660;
					g.gain.value = 0.25;
					o.connect(g);
					g.connect(c.destination);
					o.start();
					o.stop(c.currentTime + 0.4);
				};
				const btn = (label, fn) => {
					const b = document.createElement('button');
					b.textContent = label;
					b.addEventListener('click', (e) => { e.stopPropagation(); try { fn(); } catch (err) { b.textContent = label + ' (' + err.name + ')'; } });
					bar.appendChild(b);
				};
				btn('Beep A (game)', () => { const c = ctxs[0]; c.resume(); beep(c); });
				btn('Beep B (new)', () => { const c = new (window.webkitAudioContext && !window.AudioContext ? window.webkitAudioContext : window.AudioContext)(); c.resume(); beep(c); });
				btn('Beep C (<audio>)', () => {
					const rate = 8000;
					const n = rate * 0.4;
					const buf = new Uint8Array(44 + n);
					const dv = new DataView(buf.buffer);
					const w = (o, str) => { for (let i = 0; i < str.length; i++) { buf[o + i] = str.charCodeAt(i); } };
					w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true);
					dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
					dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
					for (let i = 0; i < n; i++) { buf[44 + i] = 128 + Math.round(60 * Math.sin(2 * Math.PI * 660 * i / rate)); }
					new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))).play();
				});
				document.body.appendChild(bar);
			}
			line.textContent = 'audio: ' + (ctxs.map((c) => c.state + ' ' + c.sampleRate + 'Hz t=' + c.currentTime.toFixed(1)).join(', ') || 'no context')
				+ ' | session: ' + (navigator.audioSession ? navigator.audioSession.type : 'n/a')
				+ ' | silent el: ' + (silent ? (silent.paused ? 'paused' : 'playing') : 'none')
				+ ' | mode: ' + (new URLSearchParams(location.search).get('audiomode') || 'default')
				+ ' | touch ' + navigator.maxTouchPoints + ' | ' + (window.parent !== window ? 'in frame' : 'top');
		}
	};
	let tapped = false;
	// touch, Magic Keyboard trackpad clicks (pointer/mouse events) and keys alike
	['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach((e) => document.addEventListener(e, () => { tapped = true; setTimeout(refresh, 600); }, true));
	setInterval(() => { if (tapped || debug) { refresh(); } }, 1000);
}());

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":30316888,"index.wasm":37686550,"index.mobile.pck":16098320},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {

			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {

					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}

		setStatusMode('progress');
		// Phones get the phone pack (half-size art); desktops the full one.
		// ?pack=mobile / ?pack=desktop overrides the guess.
		const forced = new URLSearchParams(location.search).get('pack');
		const phone = forced ? forced === 'mobile'
			: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
			|| (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
			|| (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);

		document.addEventListener('gesturestart', (e) => e.preventDefault());
		document.addEventListener('dblclick', (e) => e.preventDefault());
		document.addEventListener('pointerdown', () => {
			const c = document.getElementById('canvas');
			if (c && document.activeElement !== c) { c.focus(); }
		}, true);
		engine.startGame({
			'mainPack': pack,
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

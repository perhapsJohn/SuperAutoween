		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	/* phones: no text selection, long-press callout, tap flash or zoom (the arcade
	   can't inject this into a cross-origin frame, so the game page does it) */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}

#canvas { touch-action: none; }

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b0f33;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

// Browsers start audio suspended until a gesture: keep every AudioContext the
// engine makes and resume them on the first tap / click / key.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	if (AC) {
		const Wrapped = function (...args) { const c = new AC(...args); ctxs.push(c); return c; };
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// iPhone: the ringer switch mutes Web Audio unless the page's audio session
	// is "playback" (Safari 17+); older iOS needs an <audio> element playing,
	// started from a tap, for the same effect.
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* not iOS */ }
	let silent = null;
	const keepSession = () => {
		if (silent || navigator.audioSession) { return; }
		silent = new Audio('data:audio/wav;base64,UklGRiUAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQEAAACA');
		silent.loop = true;
		silent.setAttribute('playsinline', '');
		silent.play().catch(() => { silent = null; });
	};
	// Every tap / click / key: resume any suspended (or iOS "interrupted", after a
	// call or app switch) context, and push one silent sample through it, which
	// older iOS needs before it really starts. Must run inside the gesture.
	const unlock = () => {
		keepSession();
		ctxs.forEach((c) => {
			if (c.state === 'running' || c.state === 'closed') { return; }
			c.resume();
			try {
				const b = c.createBufferSource();
				b.buffer = c.createBuffer(1, 1, 22050);
				b.connect(c.destination);
				b.start(0);
			} catch (e) { /* context not ready yet */ }
		});
	};
	['pointerdown', 'pointerup', 'touchstart', 'touchend', 'keydown', 'click'].forEach((e) => document.addEventListener(e, unlock, true));
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) { ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(() => {}); } }); }
	});
	window.__audio = ctxs;   // debugging: window.__audio.map((c) => c.state)
}());

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":30316216,"index.wasm":37686550,"index.mobile.pck":16097648},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Phones get the phone pack (half-size art); desktops the full one.
		// ?pack=mobile / ?pack=desktop overrides the guess.
		const forced = new URLSearchParams(location.search).get('pack');
		const phone = forced ? forced === 'mobile'
			: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
			|| (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
			|| (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);
		const pack = (GODOT_CONFIG['executable'] || 'index') + (phone ? '.mobile.pck' : '.pck');
		// the page itself never zooms (pinch, double-tap); taps keep keys on the game
		document.addEventListener('gesturestart', (e) => e.preventDefault());
		document.addEventListener('dblclick', (e) => e.preventDefault());
		document.addEventListener('pointerdown', () => {
			const c = document.getElementById('canvas');
			if (c && document.activeElement !== c) { c.focus(); }
		}, true);
		engine.startGame({
			'mainPack': pack,
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
